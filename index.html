<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ✈️</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  font-family: 'Lato', sans-serif;
  background: linear-gradient(175deg,
    #0a1628 0%, #0d2247 12%, #1a3a6e 28%,
    #2e6db4 48%, #5ba3d9 65%,
    #a8d8f0 80%, #d4eef9 92%, #eaf6fb 100%);
  overflow-x: hidden;
  cursor: default;
}

/* ── STARS ── */
#stars-canvas {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
}

/* ── CLOUDS ── */
.cloud {
  position: fixed;
  pointer-events: none;
  z-index: 1;
  animation: driftCloud linear infinite;
}
.cloud svg { display: block; }
@keyframes driftCloud {
  from { transform: translateX(-320px); }
  to   { transform: translateX(110vw); }
}

/* ── TITLE ── */
#hb-title {
  position: relative; z-index: 10;
  text-align: center;
  padding: 52px 24px 0;
}
#hb-title h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.8rem, 9vw, 7rem);
  letter-spacing: 0.04em;
  background: linear-gradient(100deg, #ffecd2, #fcb69f, #ffeaa7, #dfe9f3, #ffecd2);
  background-size: 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 5s linear infinite;
  filter: drop-shadow(0 2px 18px rgba(255,200,100,0.35));
}
@keyframes shimmer { to { background-position: 300% center; } }

#hb-title p {
  margin-top: 12px;
  font-size: clamp(0.9rem, 2.5vw, 1.15rem);
  font-weight: 300;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
  animation: fadeUp 1.6s ease both;
  animation-delay: 0.4s;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── HINT ── */
#hint {
  position: relative; z-index: 10;
  text-align: center;
  margin: 18px 0 0;
  font-size: 0.8rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  animation: breathe 3s ease-in-out infinite;
}
@keyframes breathe { 0%,100%{opacity:.3} 50%{opacity:.7} }

/* ── SKY STAGE ── */
#sky {
  position: relative;
  width: 100%; height: 55vh;
  min-height: 320px;
  z-index: 5;
  margin-top: 10px;
}

/* ── PLANE ── */
.plane {
  position: absolute;
  cursor: pointer;
  user-select: none;
  transition: filter 0.25s;
  will-change: transform;
}
.plane:hover { filter: drop-shadow(0 0 10px rgba(255,255,255,0.9)); }
.plane svg { display: block; width: 100%; height: 100%; }

/* bob animations (varied) */
@keyframes bob0 { 0%,100%{transform:translateY(0) rotate(var(--r))} 50%{transform:translateY(-14px) rotate(var(--r))} }
@keyframes bob1 { 0%,100%{transform:translateY(0) rotate(var(--r))} 50%{transform:translateY(-10px) rotate(var(--r))} }
@keyframes bob2 { 0%,100%{transform:translateY(0) rotate(var(--r))} 50%{transform:translateY(-18px) rotate(var(--r))} }
@keyframes bob3 { 0%,100%{transform:translateY(0) rotate(var(--r))} 50%{transform:translateY(-8px)  rotate(var(--r))} }
@keyframes bob4 { 0%,100%{transform:translateY(0) rotate(var(--r))} 50%{transform:translateY(-16px) rotate(var(--r))} }
@keyframes bob5 { 0%,100%{transform:translateY(0) rotate(var(--r))} 50%{transform:translateY(-12px) rotate(var(--r))} }
@keyframes bob6 { 0%,100%{transform:translateY(0) rotate(var(--r))} 50%{transform:translateY(-20px) rotate(var(--r))} }

/* fly-away */
.fly-away {
  animation: flyAway 1.6s cubic-bezier(.4,0,1,1) forwards !important;
  pointer-events: none !important;
}
@keyframes flyAway {
  0%   { opacity: 1; transform: translate(0,0) rotate(var(--r)) scale(1); }
  100% { opacity: 0; transform: translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(0.1); }
}

/* ── MODAL OVERLAY ── */
#cert-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(5, 15, 35, 0.72);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
#cert-overlay.show { display: flex; }

/* ── CERTIFICATE BOX ── */
#cert-box {
  position: relative;
  width: min(540px, 92vw);
  background: linear-gradient(145deg, rgba(255,255,255,0.13), rgba(255,255,255,0.05));
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 24px;
  padding: 36px 36px 30px;
  text-align: center;
  box-shadow: 0 32px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.2);
  animation: unfoldBox 0.65s cubic-bezier(.34,1.56,.64,1) both;
  color: #fff;
}
@keyframes unfoldBox {
  0%   { transform: perspective(800px) rotateX(90deg) scale(0.6); opacity: 0; }
  100% { transform: perspective(800px) rotateX(0deg)  scale(1);   opacity: 1; }
}

/* gold corner ornaments */
#cert-box::before, #cert-box::after {
  content: '✦';
  position: absolute;
  font-size: 1.1rem;
  color: rgba(255,215,100,0.6);
}
#cert-box::before { top: 14px; left: 18px; }
#cert-box::after  { bottom: 14px; right: 18px; }

#cert-box .cert-label {
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(255,215,100,0.7);
  margin-bottom: 6px;
}
#cert-box h2 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.4rem, 4vw, 2rem);
  background: linear-gradient(90deg, #ffecd2, #fcb69f, #ffeaa7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
}
#cert-box .divider {
  width: 60px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,215,100,0.6), transparent);
  margin: 10px auto;
}
#cert-box img {
  width: 100%;
  border-radius: 14px;
  margin: 14px 0;
  border: 1px solid rgba(255,255,255,0.18);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  display: block;
}
#cert-box .cert-footer {
  font-size: 0.85rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.6);
  line-height: 1.7;
}
#cert-box .cert-footer strong {
  color: rgba(255,215,100,0.85);
  font-weight: 400;
}

#close-cert {
  position: absolute; top: 14px; right: 18px;
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.5);
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s;
  line-height: 1;
}
#close-cert:hover {
  background: rgba(255,255,255,0.12);
  color: #fff;
  transform: rotate(90deg);
}

/* ── CONFETTI CANVAS ── */
#confetti-canvas {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 200;
}

/* ── HORIZON GLOW ── */
.horizon {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 120px;
  background: linear-gradient(0deg, rgba(255,160,80,0.18) 0%, transparent 100%);
  pointer-events: none; z-index: 2;
}

/* ── SPARKLES & CAKES ── */
.deco {
  position: absolute;
  pointer-events: none;
  z-index: 7;
  font-size: 1.4rem;
  animation: decoFloat var(--dur) ease-in-out infinite;
  opacity: 0.85;
}
@keyframes decoFloat {
  0%,100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.7; }
  50%     { transform: translateY(-12px) rotate(15deg) scale(1.15); opacity: 1; }
}

/* ── PHOTO CARDS ── */
.photo-card {
  position: absolute;
  width: min(260px, 28vw);
  border-radius: 0;
  overflow: hidden;
  border: none;
  box-shadow: 0 16px 48px rgba(0,0,0,0.45);
  background: none;
  z-index: 6;
  animation: fadeUp 1s ease both;
}
.photo-card:nth-child(1) { left: 1%; top: 5%; animation: photoFloat1 3s ease-in-out infinite; animation-delay: 0.3s; }
.photo-card:nth-child(2) { right: 1%; top: 5%; animation: photoFloat2 3.4s ease-in-out infinite; animation-delay: 0.6s; }
@keyframes photoFloat1 {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50%     { transform: translateY(-14px) rotate(-3deg); }
}
@keyframes photoFloat2 {
  0%,100% { transform: translateY(0) rotate(3deg); }
  50%     { transform: translateY(-14px) rotate(3deg); }
}

/* puff clouds around photos */
.photo-card::before, .photo-card::after,
.photo-card .puff1, .photo-card .puff2 {
  content: '';
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.22);
  filter: blur(14px);
  pointer-events: none;
  z-index: -1;
}
.photo-card::before { width: 120px; height: 60px; top: -20px; left: -30px; }
.photo-card::after  { width: 100px; height: 50px; bottom: -18px; right: -25px; }
.photo-card .puff1  { width: 90px;  height: 45px; top: 30%;  left: -35px; }
.photo-card .puff2  { width: 80px;  height: 40px; top: 55%;  right: -30px; }
.photo-card img {
  width: 100%;
  display: block;
  height: auto;
  border-radius: 0;
}
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>
<div class="horizon"></div>

<div id="hb-title">
  <h1>Happy Birthday 🎂</h1>
  <p>✦ &nbsp; your sky is waiting &nbsp; ✦</p>
</div>
<div id="hint">click a plane &nbsp;·&nbsp; one holds a secret</div>

<div id="sky">
  <div class="photo-card"><span class="puff1"></span><span class="puff2"></span><img src="1.jpg" alt="Photo 1"></div>
  <div class="photo-card"><span class="puff1"></span><span class="puff2"></span><img src="2.jpg" alt="Photo 2"></div>
</div>

<div id="cert-overlay">
  <div id="cert-box">
    <span id="close-cert">✕</span>
    <div class="cert-label">Certificate of Flight</div>
    <h2>Birthday Pilot 🛩</h2>
    <div class="divider"></div>
    <img src="polet.jpg" alt="Flight Certificate">
    <div class="cert-footer">
      This certifies that you are officially cleared<br>
      for <strong>unlimited birthday adventures</strong> above the clouds.<br><br>
      The sky is not the limit — it's just the beginning.
    </div>
  </div>
</div>

<script>
// ── STARS ──
(function() {
  const c = document.getElementById('stars-canvas');
  const cx = c.getContext('2d');
  function resize() { c.width = innerWidth; c.height = innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const stars = Array.from({length: 160}, () => ({
    x: Math.random(), y: Math.random() * 0.55,
    r: Math.random() * 1.4 + 0.3,
    a: Math.random(), da: (Math.random() * 0.008 + 0.003) * (Math.random()<.5?1:-1)
  }));
  function drawStars() {
    cx.clearRect(0, 0, c.width, c.height);
    stars.forEach(s => {
      s.a = Math.max(0.05, Math.min(1, s.a + s.da));
      if (s.a <= 0.05 || s.a >= 1) s.da *= -1;
      cx.beginPath();
      cx.arc(s.x * c.width, s.y * c.height, s.r, 0, Math.PI*2);
      cx.fillStyle = `rgba(255,255,255,${s.a})`;
      cx.fill();
    });
    requestAnimationFrame(drawStars);
  }
  drawStars();
})();

// ── CLOUDS ──
(function() {
  const shapes = [
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80">
      <ellipse cx="100" cy="55" rx="90" ry="28" fill="white" opacity=".18"/>
      <ellipse cx="70"  cy="42" rx="50" ry="34" fill="white" opacity=".15"/>
      <ellipse cx="130" cy="40" rx="44" ry="30" fill="white" opacity=".15"/>
      <ellipse cx="100" cy="38" rx="60" ry="36" fill="white" opacity=".12"/>
    </svg>`,
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60">
      <ellipse cx="80" cy="42" rx="72" ry="22" fill="white" opacity=".16"/>
      <ellipse cx="55" cy="32" rx="38" ry="26" fill="white" opacity=".13"/>
      <ellipse cx="110" cy="30" rx="34" ry="24" fill="white" opacity=".13"/>
    </svg>`
  ];
  for (let i = 0; i < 7; i++) {
    const d = document.createElement('div');
    d.className = 'cloud';
    const w = 160 + Math.random() * 200;
    const top = 4 + Math.random() * 42;
    const dur = 22 + Math.random() * 28;
    const delay = -Math.random() * dur;
    d.style.cssText = `width:${w}px;top:${top}%;left:-320px;animation-duration:${dur}s;animation-delay:${delay}s;`;
    d.innerHTML = shapes[i % 2];
    document.body.appendChild(d);
  }
})();

// ── PLANE SVG ──
// Each plane is a clean origami-style paper plane
function makePlaneSVG(fill, shadow) {
  return `<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
    <polygon points="4,40 76,10 62,40 76,70" fill="${fill}" opacity="0.95"/>
    <polygon points="4,40 62,40 48,58" fill="${shadow}" opacity="0.55"/>
    <line x1="4" y1="40" x2="62" y2="40" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </svg>`;
}

// ── PLANE DATA ──
// 7 planes total; index 3 is the secret one (same size as others)
const planeData = [
  { left:'7%',  top:'18%', size:52, rot:-18, bobDur:2.1, color:'#e8a0bf', shadow:'#c2607a' },
  { left:'18%', top:'52%', size:46, rot: 12, bobDur:2.6, color:'#a0c4ff', shadow:'#4a7fd4' },
  { left:'33%', top:'28%', size:58, rot:-10, bobDur:1.9, color:'#ffd6a5', shadow:'#e08030' },
  { left:'50%', top:'44%', size:50, rot:  8, bobDur:2.3, color:'#caffbf', shadow:'#3a9e5f' }, // ← SECRET
  { left:'63%', top:'20%', size:44, rot:-22, bobDur:2.8, color:'#bdb2ff', shadow:'#6a50d0' },
  { left:'76%', top:'55%', size:54, rot: 16, bobDur:2.0, color:'#ffc6ff', shadow:'#c050c0' },
  { left:'88%', top:'32%', size:48, rot: -6, bobDur:2.5, color:'#a0e4f1', shadow:'#2090b0' },
];
const SECRET_INDEX = 3;

const sky = document.getElementById('sky');

planeData.forEach((d, i) => {
  const el = document.createElement('div');
  el.className = 'plane';
  el.style.cssText = `
    left:${d.left}; top:${d.top};
    width:${d.size}px; height:${d.size}px;
    --r:${d.rot}deg;
    animation: bob${i % 7} ${d.bobDur}s ease-in-out infinite;
  `;
  el.innerHTML = makePlaneSVG(d.color, d.shadow);

  if (i === SECRET_INDEX) {
    el.addEventListener('click', () => openCert(el));
  } else {
    el.addEventListener('click', () => flyAway(el));
  }
  sky.appendChild(el);
});

// ── FLY AWAY ──
function flyAway(el) {
  if (el.classList.contains('fly-away')) return;
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top  + rect.height / 2;
  const angle = Math.atan2(cy - innerHeight * 0.3, cx - innerWidth * 0.5);
  const dist = 900 + Math.random() * 400;
  el.style.setProperty('--fx', Math.cos(angle) * dist + 'px');
  el.style.setProperty('--fy', Math.sin(angle) * dist + 'px');
  el.style.setProperty('--fr', ((Math.random() - 0.5) * 540) + 'deg');
  el.classList.add('fly-away');
  burst(rect.left + rect.width/2, rect.top + rect.height/2, 22);
}

// ── OPEN CERT ──
function openCert(el) {
  // first do a little spin then open
  el.style.transition = 'transform 0.4s ease';
  el.style.transform = `rotate(${parseInt(el.style.getPropertyValue('--r') || 0) + 360}deg) scale(1.3)`;
  setTimeout(() => {
    el.style.transform = '';
    document.getElementById('cert-overlay').classList.add('show');
    burst(innerWidth/2, innerHeight/2, 140);
  }, 420);
}
document.getElementById('close-cert').addEventListener('click', () => {
  document.getElementById('cert-overlay').classList.remove('show');
});
document.getElementById('cert-overlay').addEventListener('click', e => {
  if (e.target.id === 'cert-overlay')
    document.getElementById('cert-overlay').classList.remove('show');
});

// ── CONFETTI ──
const cc = document.getElementById('confetti-canvas');
const cx2 = cc.getContext('2d');
let particles = [];
function resizeCC() { cc.width = innerWidth; cc.height = innerHeight; }
resizeCC(); window.addEventListener('resize', resizeCC);

const PALETTE = ['#ffecd2','#fcb69f','#ffeaa7','#a0c4ff','#caffbf','#ffc6ff','#bdb2ff','#ffadad'];

function burst(ox, oy, n) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    const shape = Math.random() < 0.5 ? 'rect' : 'circle';
    particles.push({
      x: ox, y: oy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      w: 5 + Math.random() * 8,
      h: 3 + Math.random() * 5,
      r: Math.random() * 4,
      rot: Math.random() * 360,
      vr: (Math.random() - 0.5) * 10,
      color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
      life: 1,
      shape
    });
  }
}

function tickConfetti() {
  cx2.clearRect(0, 0, cc.width, cc.height);
  particles = particles.filter(p => p.life > 0.02);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.12; p.vx *= 0.99;
    p.rot += p.vr; p.life -= 0.013;
    cx2.save();
    cx2.globalAlpha = p.life;
    cx2.translate(p.x, p.y);
    cx2.rotate(p.rot * Math.PI / 180);
    cx2.fillStyle = p.color;
    if (p.shape === 'circle') {
      cx2.beginPath();
      cx2.arc(0, 0, p.r + 2, 0, Math.PI * 2);
      cx2.fill();
    } else {
      cx2.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    }
    cx2.restore();
  }
  requestAnimationFrame(tickConfetti);
}
tickConfetti();

// opening burst
setTimeout(() => burst(innerWidth/2, -20, 90), 600);
setTimeout(() => burst(innerWidth * 0.25, -20, 50), 1100);
setTimeout(() => burst(innerWidth * 0.75, -20, 50), 1400);

// ── SPARKLES & CAKES ──
(function() {
  const sky = document.getElementById('sky');
  const items = [
    // around left photo
    { emoji: '🎂', left: '14%', top: '75%' },
    { emoji: '🎂', left: '2%',  top: '40%' },
    // around right photo
    { emoji: '🎂', left: '90%', top: '78%' },
    { emoji: '🎂', left: '96%', top: '35%' },
  ];
  items.forEach((item, i) => {
    const el = document.createElement('span');
    el.className = 'deco';
    el.textContent = item.emoji;
    el.style.cssText = `left:${item.left};top:${item.top};--dur:${2.2 + (i % 4) * 0.4}s;animation-delay:-${i * 0.3}s;`;
    sky.appendChild(el);
  });
})();
</script>
</body>
</html>
